<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点数分配 · 数学小课堂</title>
<link rel="stylesheet" href="lesson-engine.css">
<style>
  .allocation-lesson .pill,
  .allocation-lesson .hint-btn { min-height: 44px; }
  .allocation-lesson #questionStage:empty { display: none; }
  .allocation-lesson #exploreStage { padding: 14px 10px; }
  .side-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(100%, 440px); }
  .side-control { min-width: 0; padding: 10px 4px; border-radius: 14px; text-align: center; font-weight: 800; }
  .side-control.horizontal { background: #ffedd5; color: #9a3412; }
  .side-control.vertical { background: #fef3c7; color: #854d0e; }
  .side-control strong { display: block; font-size: 1.6rem; }
  .stick-move {
    width: 100%; min-height: 48px; margin-top: 5px; border: 1px solid currentColor;
    border-radius: 10px; background: #fff; color: inherit; font: inherit; cursor: pointer;
  }
  .stick-move:disabled { opacity: .65; cursor: default; }
  .plot-record { margin: 0; text-align: center; font-weight: 700; }
  .plot-board {
    --tile-size: clamp(21px, 5.5vw, 29px);
    display: grid; place-items: center; min-height: calc(7 * var(--tile-size) + 24px);
    width: min(100%, 440px); border-radius: 14px; background: #f5f0e7;
    color: #78350f; text-align: center;
  }
  .plot {
    position: relative; display: grid;
    grid-template: repeat(var(--height), var(--tile-size)) / repeat(var(--width), var(--tile-size));
  }
  .plot-tile { background: #bbf7d0; border: 1px solid #6ee7b7; }
  .plot-edge { position: absolute; display: flex; }
  .plot-edge.top, .plot-edge.bottom { left: 0; right: 0; height: 8px; color: #b45309; }
  .plot-edge.left, .plot-edge.right { top: 0; bottom: 0; width: 8px; flex-direction: column; color: #78350f; }
  .plot-edge.top { top: -4px; }
  .plot-edge.bottom { bottom: -4px; }
  .plot-edge.left { left: -4px; }
  .plot-edge.right { right: -4px; }
  .wood-stick { flex: 1; background: currentColor; border: 1px solid #fef3c7; border-radius: 3px; }
  .plot-score { font-size: 1.35rem; font-weight: 900; }
</style>
<script src="narration/manifest.js"></script>
<script src="narration/parts.js"></script>
<script src="narration/resolver.js"></script>
<script src="narration/player.js"></script>
</head>
<body class="allocation-lesson">
<script>
function renderStickExperiment(stage, unlockPractice) {
  const halfPerimeter = 8;
  const target = (halfPerimeter / 2) ** 2;
  let width = 7;
  let best = 0;

  stage.innerHTML = `
    <div class="side-controls">
      <div class="side-control horizontal">
        每条横边
        <strong id="widthCount"></strong>
        <button type="button" class="stick-move" id="moveToWide">横边各加 1 根</button>
      </div>
      <div class="side-control vertical">
        每条竖边
        <strong id="heightCount"></strong>
        <button type="button" class="stick-move" id="moveToTall">竖边各加 1 根</button>
      </div>
    </div>
    <div class="plot-board" aria-hidden="true"></div>
    <output class="plot-score" aria-live="polite" aria-atomic="true"></output>
    <p class="plot-record"></p>
  `;

  const widthCount = stage.querySelector('#widthCount');
  const heightCount = stage.querySelector('#heightCount');
  const toWide = stage.querySelector('#moveToWide');
  const toTall = stage.querySelector('#moveToTall');
  const board = stage.querySelector('.plot-board');
  const score = stage.querySelector('.plot-score');
  const record = stage.querySelector('.plot-record');

  function edge(side, sticks) {
    return `<div class="plot-edge ${side}">${'<span class="wood-stick"></span>'.repeat(sticks)}</div>`;
  }

  function update() {
    const height = halfPerimeter - width;
    const area = width * height;
    best = Math.max(best, area);

    widthCount.textContent = `${width} 根`;
    heightCount.textContent = `${height} 根`;
    toWide.disabled = height === 0;
    toTall.disabled = width === 0;
    record.textContent = `本轮最多围出 ${best} 格`;

    if (area === 0) {
      board.textContent = '有一对边没有木棍。';
      score.textContent = '围不成长方形';
      return;
    }

    board.innerHTML = `<div class="plot" style="--width:${width}; --height:${height}">
      ${'<span class="plot-tile"></span>'.repeat(area)}
      ${edge('top', width)}${edge('bottom', width)}${edge('left', height)}${edge('right', height)}
    </div>`;
    score.textContent = `${width} × ${height} = ${area} 格`;
    if (area === target) unlockPractice();
  }

  toWide.addEventListener('click', () => {
    width += 1;
    update();
  });
  toTall.addEventListener('click', () => {
    width -= 1;
    update();
  });
  update();
}

window.LESSON_CONFIG = {

  explore: {
    title: '🪵 小木棍围方格',
    lead: '一共 16 根木棍。横边各加 1 根，竖边就各少 1 根。反过来也一样。',
    note: '每个小方格的边长和木棍一样。挪一挪，看看最多能围出几格。',
    voice: '用十六根一样长的木棍围长方形。试试最多能围出几格。',
    hint: '试试让横边和竖边的长度更接近。每挪一次，比一比方格数。',
    unlock: '围成正方形啦！再挪一次，比比哪个面积大。',
    unlockVoice: '围成正方形啦！再比比面积。',
    render: renderStickExperiment
  },

      hard: true

  done: {
    badge: '🏆',

  nextText: '回到冒险地图 🗺️',
  nextHref: 'index.html'

</script>

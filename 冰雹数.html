<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰雹数</title>
<link rel="stylesheet" href="lab-kit.css">
<style>
  [hidden] { display: none !important; }
  .hail, .hail * { box-sizing: border-box; }
  .hail {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    max-width: 100%;
    color: var(--ink, #1F2937);
    font-family: inherit;
  }
  .hail-cap {
    margin: 0 0 6px;
    font-weight: 800;
    font-size: 1rem;
  }
  .hail-soft {
    margin: 6px 0 0;
    color: var(--soft, #6B7280);
    font-weight: 700;
    font-size: 0.95rem;
  }
  .hail-picker { text-align: center; }
  .hail-stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .hail button, .hail input {
    font-family: inherit;
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
  }
  .hail button { cursor: pointer; }
  .hail button:focus-visible,
  .hail input:focus-visible {
    outline: 3px solid var(--purple, #7C3AED);
    outline-offset: 2px;
  }
  .hail-pm {
    width: 64px;
    height: 64px;
    min-width: 64px;
    min-height: 64px;
    padding: 0;
    border: 2px solid #e5e7eb;
    border-radius: 18px;
    background: #fff;
    color: var(--ink, #1F2937);
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
    box-shadow: 0 3px 8px rgba(0,0,0,.08);
  }
  .hail-pm:active { transform: scale(0.96); }
  .hail-input {
    width: 3.4em;
    min-height: 76px;
    padding: 0 4px;
    border: 3px solid var(--blue, #2563EB);
    border-radius: 18px;
    background: #fff;
    color: var(--ink, #1F2937);
    font-size: 52px;
    font-weight: 900;
    line-height: 1;
    text-align: center;
    font-variant-numeric: tabular-nums;
    user-select: text;
    -webkit-user-select: text;
  }
  .hail-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .hail button.lab-btn {
    flex: 1 1 120px;
    min-height: 48px;
    min-width: 44px;
  }
  .hail button.lab-btn.ghost.is-on {
    border-color: var(--purple, #7C3AED);
    color: var(--purple, #7C3AED);
    background: #f5f3ff;
  }
  #hailCompareBtn { flex: 1 1 180px; }
  .hail-chartbox {
    position: relative;
    min-width: 0;
    max-width: 100%;
    min-height: 188px;
    padding: 8px;
    border-radius: 18px;
    background: #f4f8ff;
  }
  .hail-empty {
    position: absolute;
    inset: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 12px;
    text-align: center;
    font-weight: 800;
    color: var(--soft, #6B7280);
    pointer-events: none;
  }
  .hail-hero {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    min-height: 96px;
    margin-bottom: 4px;
  }
  .hail-num,
  .hail-finale-peak,
  .hail-finale-steps,
  .hail-meter strong,
  .hail-col-steps,
  .hail-col-name,
  .hail-op {
    white-space: nowrap;
    word-break: keep-all;
    overflow-wrap: normal;
  }
  .hail-num {
    font-size: clamp(56px, 16vw, 92px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--ink, #1F2937);
  }
  .hail-num.is-hot { color: var(--orange, #EA580C); }
  .hail-op {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 1.3rem;
    font-weight: 900;
  }
  .hail-op.is-idle { background: #eef2f7; color: var(--soft, #6B7280); }
  .hail-op.is-half { background: #dbeafe; color: #1d4ed8; }
  .hail-op.is-triple { background: #ffedd5; color: #c2410c; }
  .hail-meters {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin: 0 0 6px;
  }
  .hail-meter { text-align: center; min-width: 88px; }
  .hail-meter span {
    display: block;
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--soft, #6B7280);
  }
  .hail-meter strong {
    display: block;
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 900;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .hail-meter-peak strong { color: var(--orange, #EA580C); }
  .hail-path-scroll {
    min-width: 0;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .hail-path {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 168px;
    width: max-content;
    min-width: 100%;
    box-shadow: inset 0 -2px 0 #d5e2f5;
  }
  .hail-bar {
    flex: 0 0 6px;
    width: 6px;
    min-width: 6px;
    height: 3px;
    border-radius: 4px 4px 1px 1px;
    background: #93c5fd;
  }
  .hail-path.is-sparse .hail-bar {
    flex-basis: 22px;
    width: 22px;
    min-width: 22px;
    border-radius: 6px 6px 2px 2px;
  }
  .hail-bar.is-peak { background: var(--orange, #EA580C); }
  .hail-bar.is-now { background: var(--purple, #7C3AED); }
  .hail-bar.is-now.is-peak {
    background: var(--orange, #EA580C);
    outline: 2px solid var(--purple, #7C3AED);
    outline-offset: 1px;
  }
  .hail-legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    margin: 8px 0 0;
    color: var(--soft, #6B7280);
    font-size: 0.92rem;
    font-weight: 800;
  }
  .hail-swatch {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    display: inline-block;
  }
  .hail-swatch.is-peak { background: var(--orange, #EA580C); }
  .hail-swatch.is-now { background: var(--purple, #7C3AED); }
  .hail-finale {
    text-align: center;
    padding: 14px 12px 12px;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 8px 24px rgba(37, 99, 235, .08);
  }
  .hail-finale.is-ok { background: #f0fdf4; }
  .hail-finale.is-bad { background: #fff7ed; }
  .hail-finale-peak,
  .hail-finale-steps {
    margin: 0;
    font-weight: 900;
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
  }
  .hail-finale-peak {
    font-size: clamp(30px, 8vw, 44px);
    color: var(--orange, #EA580C);
  }
  .hail-finale-steps {
    margin-top: 2px;
    font-size: clamp(24px, 6vw, 34px);
  }
  .hail-note {
    margin: 8px 0 0;
    color: var(--soft, #6B7280);
    font-weight: 700;
  }
  .hail-debug {
    margin: 8px 0 0;
    color: #9a3412;
    font-weight: 800;
    line-height: 1.4;
  }
  .hail-compare {
    min-width: 0;
    max-width: 100%;
    padding-top: 4px;
    border-top: 2px dashed #e5e7eb;
  }
  .hail-compare h2 {
    margin: 8px 0 0;
    font-size: 1.2rem;
    font-weight: 900;
  }
  .hail-cmp-scroll {
    min-width: 0;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    padding: 8px 2px 12px;
  }
  .hail-cmp {
    display: flex;
    align-items: stretch;
    gap: 6px;
    width: max-content;
    min-height: 210px;
  }
  .hail-col {
    flex: 0 0 52px;
    width: 52px;
    min-width: 52px;
    min-height: 200px;
    padding: 4px 2px 6px;
    border: 3px solid transparent;
    border-radius: 14px;
    background: transparent;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }
  .hail-col-steps {
    min-height: 22px;
    font-size: 14px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .hail-col-plot {
    width: 100%;
    height: 128px;
    min-height: 44px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .hail-col-bar {
    width: 28px;
    min-height: 6px;
    border-radius: 8px 8px 3px 3px;
    background: #60A5FA;
  }
  .hail-col-name {
    min-height: 26px;
    font-size: 18px;
    font-weight: 900;
    line-height: 1.3;
  }
  .hail-col.is-yes { background: #ecfdf5; }
  .hail-col.is-yes .hail-col-bar { background: var(--green, #16A34A); }
  .hail-col.is-no { background: #fff7ed; }
  .hail-cmp-msg {
    margin: 4px 0 0;
    font-size: 1.15rem;
    font-weight: 900;
    color: var(--green, #16A34A);
    line-height: 1.4;
  }
  @keyframes hail-shake {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-5px); }
    70% { transform: translateX(5px); }
  }
  .hail-col.is-no { animation: hail-shake .28s ease; }
  @media (prefers-reduced-motion: reduce) {
    .hail-col.is-no { animation: none; }
  }
  @media (max-width: 520px) {
    .hail button.lab-btn { flex-basis: 100%; }
  }
</style>
</head>
<body>
<script src="lab-kit.js"></script>
<script>
(function () {
  'use strict';

  // 步数 = 变到 1 的次数，不计起点。1 是 0 步，2→1 是 1 步。
  function collatz(n) {
    var x = n;
    var seq = [x];
    var guard = 0;
    while (x !== 1 && guard < 10000) {
      x = (x % 2 === 0) ? (x / 2) : (3 * x + 1);
      if (!Number.isInteger(x)) break;
      seq.push(x);
      guard += 1;
    }
    var peak = seq[0];
    for (var k = 1; k < seq.length; k += 1) {
      if (seq[k] > peak) peak = seq[k];
    }
    return { seq: seq, steps: seq.length - 1, peak: peak, done: x === 1 };
  }

  var resetAll = function () {};
  Lab.mount({
    id: 'lab-hail',
    title: '冰雹数',
    emoji: '❄️',
    lead: '偶数折半，单数就三倍再加 1。看它怎么跳。',
    parent: [
      '<p>偶数就折半，也就是除以 2。奇数就乘 3，再加 1。一直这样做，直到变成 1。</p>',
      '<p>步数只数变了几次，开头那个数不算。2 变成 1，是 1 步。1 自己不用变，是 0 步。</p>',
      '<p>从 27 出发，最高会跳到 <b>9232</b>，一共 <b>111</b> 步。</p>',
      '<p>1 到 30 里面，步数最多的是 <b>27</b>，就是 111 步，没有并列。</p>',
      '<p>数学家还没证明每个数最后都会跳到 1。和孩子玩的时候，当成观察就好：看它怎么跳、哪一次最高、哪个数跳得最久。</p>'
    ].join(''),
    goals: [
      { id: 'peak', text: '找到 27 跳得最高的地方' },
      { id: 'most', text: '找出 30 以内步数最多的数' }
    ],
    hints: [
      { id: 'hint-peak', text: '输入 27，看柱子里最高的那一根。' },
      { id: 'hint-most', text: '按「比一比」，再点最高的那根柱子。' }
    ],
    onReset: function () { resetAll(); }
  });

  var stage = document.getElementById('stage');
  var root = document.createElement('div');
  root.className = 'hail';
  root.innerHTML = [
    '<div class="hail-picker">',
    '<label class="hail-cap" for="hailInput">从几出发</label>',
    '<div class="hail-stepper">',
    '<button type="button" class="hail-pm" id="hailMinus" aria-label="减 1">−</button>',
    '<input id="hailInput" class="hail-input" inputmode="numeric" maxlength="2" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" value="27">',
    '<button type="button" class="hail-pm" id="hailPlus" aria-label="加 1">+</button>',
    '</div>',
    '<p class="hail-soft" id="hailRange">1 到 99，点数字也能改</p>',
    '</div>',
    '<div class="hail-actions">',
    '<button type="button" class="lab-btn" id="hailStart">开始跳</button>',
    '<button type="button" class="lab-btn ghost" id="hailFast" aria-pressed="false">快进</button>',
    '<button type="button" class="lab-btn purple" id="hailCompareBtn">比一比 1 到 30</button>',
    '</div>',
    '<div class="hail-chartbox">',
    '<div class="hail-live" id="hailLive" hidden>',
    '<div class="hail-hero" aria-live="off">',
    '<div class="hail-num" id="hailNum">27</div>',
    '<div class="hail-op is-idle" id="hailOp">准备跳</div>',
    '</div>',
    '<div class="hail-meters">',
    '<div class="hail-meter hail-meter-peak"><span>最高</span><strong id="hailPeak">—</strong></div>',
    '<div class="hail-meter"><span>已跳</span><strong id="hailSteps">—</strong></div>',
    '</div>',
    '</div>',
    '<p class="hail-empty" id="hailEmpty">按「开始跳」，看数字怎么变。</p>',
    '<div class="hail-path-scroll" id="hailScroll">',
    '<div class="hail-path" id="hailChart" aria-hidden="true"></div>',
    '</div>',
    '<p class="hail-legend" id="hailLegend" hidden>',
    '<i class="hail-swatch is-peak" aria-hidden="true"></i> 橙条是最高',
    '<i class="hail-swatch is-now" aria-hidden="true"></i> 紫条是现在',
    '</p>',
    '</div>',
    '<div class="hail-finale" id="hailFinale" hidden aria-live="polite">',
    '<p class="hail-finale-peak" id="hailFinalePeak"></p>',
    '<p class="hail-finale-steps" id="hailFinaleSteps"></p>',
    '<p class="hail-note" id="hailNote"></p>',
    '<p class="hail-debug" id="hailDebug" hidden></p>',
    '</div>',
    '<div class="hail-compare" id="hailCompare" hidden>',
    '<h2>1 到 30，谁跳得最久？</h2>',
    '<p class="hail-soft">左右滑一滑，点一根柱子。</p>',
    '<div class="hail-cmp-scroll" id="hailCmpScroll">',
    '<div class="hail-cmp" id="hailCmp" role="group" aria-label="1 到 30 的步数"></div>',
    '</div>',
    '<p class="hail-cmp-msg" id="hailCmpMsg" hidden></p>',
    '<p class="hail-debug" id="hailCmpDebug" hidden></p>',
    '</div>'
  ].join('');
  stage.appendChild(root);

  var input = document.getElementById('hailInput');
  var fastBtn = document.getElementById('hailFast');
  var live = document.getElementById('hailLive');
  var numEl = document.getElementById('hailNum');
  var opEl = document.getElementById('hailOp');
  var peakEl = document.getElementById('hailPeak');
  var stepEl = document.getElementById('hailSteps');
  var emptyEl = document.getElementById('hailEmpty');
  var scrollEl = document.getElementById('hailScroll');
  var chart = document.getElementById('hailChart');
  var legend = document.getElementById('hailLegend');
  var finale = document.getElementById('hailFinale');
  var finalePeak = document.getElementById('hailFinalePeak');
  var finaleSteps = document.getElementById('hailFinaleSteps');
  var noteEl = document.getElementById('hailNote');
  var debugEl = document.getElementById('hailDebug');
  var compareBox = document.getElementById('hailCompare');
  var cmpScroll = document.getElementById('hailCmpScroll');
  var cmp = document.getElementById('hailCmp');
  var cmpMsg = document.getElementById('hailCmpMsg');
  var cmpDebug = document.getElementById('hailCmpDebug');

  var CHART_H = 156;
  var startN = 27;
  var runId = 0;
  var timer = 0;
  var resume = null;
  var playing = false;
  var fastMode = false;
  var bars = [];
  var paintedPeak = -1;
  var dragMoved = false;
  var dragX = 0;

  function updateFastBtn() {
    fastBtn.setAttribute('aria-pressed', fastMode ? 'true' : 'false');
    fastBtn.classList.toggle('is-on', fastMode);
  }

  function stopAnim() {
    runId += 1;
    window.clearTimeout(timer);
    timer = 0;
    resume = null;
    playing = false;
    fastMode = false;
    updateFastBtn();
  }

  function setOp(kind) {
    opEl.className = 'hail-op is-' + (kind === 'stop' ? 'idle' : kind);
    if (kind === 'half') opEl.textContent = '折半';
    else if (kind === 'triple') opEl.textContent = '三倍加 1';
    else if (kind === 'stop') opEl.textContent = '不用跳';
    else opEl.textContent = '准备跳';
  }

  function showIdle() {
    live.hidden = true;
    legend.hidden = true;
    finale.hidden = true;
    debugEl.hidden = true;
    finale.classList.remove('is-ok', 'is-bad');
    chart.replaceChildren();
    chart.classList.remove('is-sparse');
    bars = [];
    paintedPeak = -1;
    emptyEl.hidden = false;
  }

  function delayFor(nextIndex) {
    if (fastMode) return 12;
    if (nextIndex <= 6) return 200;
    return 20;
  }

  function paint(i, seq, peak) {
    var peakChanged = peak !== paintedPeak;
    paintedPeak = peak;
    var from = peakChanged ? 0 : Math.max(0, i - 1);
    var bar = bars[i];
    if (!bar) {
      bar = document.createElement('div');
      bar.className = 'hail-bar';
      chart.appendChild(bar);
      bars[i] = bar;
    }
    var k;
    for (k = from; k <= i; k += 1) {
      var el = bars[k];
      var v = seq[k];
      el.style.height = Math.max(3, Math.round(v / peak * CHART_H)) + 'px';
      el.classList.toggle('is-now', k === i);
      el.classList.toggle('is-peak', v === peak);
    }
    var view = scrollEl.clientWidth || 0;
    if (view) {
      scrollEl.scrollLeft = Math.max(0, bar.offsetLeft - view + 40);
    }
    numEl.textContent = String(seq[i]);
    numEl.classList.toggle('is-hot', i > 0 && seq[i] === peak);
    if (i === 0) setOp('idle');
    else setOp(seq[i - 1] % 2 === 0 ? 'half' : 'triple');
    peakEl.textContent = String(peak);
    stepEl.textContent = String(i);
  }

  function finish(id, n, result) {
    if (id !== runId) return;
    var peak = result.peak;
    var steps = result.steps;
    finale.hidden = false;
    finalePeak.textContent = '最高 ' + peak;
    finaleSteps.textContent = '共 ' + steps + ' 步';
    finale.classList.remove('is-ok', 'is-bad');
    debugEl.hidden = true;
    if (!result.done) noteEl.textContent = '还没跳到 1。';
    else if (steps === 0) {
      noteEl.textContent = '1 不用再跳。';
      setOp('stop');
    } else noteEl.textContent = '起步那个数不算一步。';

    if (n === 27 && result.done && peak === 9232 && steps === 111) {
      finale.classList.add('is-ok');
      Lab.goal('peak');
      Lab.say('从 27 出发，最高跳到 9232。');
      return;
    }
    if (n === 27) {
      finale.classList.add('is-bad');
      debugEl.hidden = false;
      debugEl.textContent = '算出来：最高 ' + peak + '，共 ' + steps + ' 步。和 9232、111 对不上，所以没有打勾。';
    }
  }

  function startAnim(fast) {
    stopAnim();
    var id = runId;
    var n = startN;
    fastMode = !!fast;
    playing = true;
    updateFastBtn();
    var result = collatz(n);
    var seq = result.seq;
    chart.replaceChildren();
    bars = [];
    paintedPeak = -1;
    emptyEl.hidden = true;
    live.hidden = false;
    legend.hidden = false;
    finale.hidden = true;
    debugEl.hidden = true;
    finale.classList.remove('is-ok', 'is-bad');
    chart.classList.toggle('is-sparse', seq.length < 24);

    var peak = seq[0];
    var i = 0;
    function draw() {
      if (seq[i] > peak) peak = seq[i];
      paint(i, seq, peak);
    }
    draw();

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!result.done || reduce || seq.length === 1) {
      for (i = 1; i < seq.length; i += 1) draw();
      playing = false;
      fastMode = false;
      updateFastBtn();
      finish(id, n, result);
      return;
    }

    function tick() {
      if (id !== runId) return;
      i += 1;
      draw();
      if (i >= seq.length - 1) {
        playing = false;
        fastMode = false;
        resume = null;
        updateFastBtn();
        finish(id, n, result);
        return;
      }
      timer = window.setTimeout(tick, delayFor(i + 1));
    }
    resume = tick;
    timer = window.setTimeout(tick, delayFor(1));
  }

  function clampFromInput() {
    var digits = String(input.value).replace(/\D/g, '');
    if (!digits) return startN;
    var n = parseInt(digits, 10);
    if (!Number.isFinite(n) || n < 1) return 1;
    if (n > 99) return 99;
    return n;
  }

  function setStart(n) {
    if (n < 1) n = 1;
    if (n > 99) n = 99;
    var changed = n !== startN;
    startN = n;
    input.value = String(n);
    if (!changed) return;
    stopAnim();
    showIdle();
  }

  function clearCompare() {
    cmp.replaceChildren();
    compareBox.hidden = true;
    cmpMsg.hidden = true;
    cmpMsg.textContent = '';
    cmpDebug.hidden = true;
    cmpDebug.textContent = '';
  }

  function showCompare() {
    Lab.click();
    input.blur();
    var rows = [];
    var maxSteps = 0;
    var n;
    for (n = 1; n <= 30; n += 1) {
      var r = collatz(n);
      rows.push({ n: n, steps: r.steps });
      if (r.steps > maxSteps) maxSteps = r.steps;
    }
    var winners = rows.filter(function (row) { return row.steps === maxSteps; });
    var row27 = null;
    rows.forEach(function (row) { if (row.n === 27) row27 = row; });
    var ok = winners.length === 1 && winners[0].n === 27 && winners[0].steps === 111;
    if (!ok) {
      cmpDebug.hidden = false;
      cmpDebug.textContent = '算出来最多是 ' + winners.map(function (w) {
        return w.n + ' 的 ' + w.steps + ' 步';
      }).join('、') + '。27 算出 ' + (row27 ? row27.steps : '?') + ' 步。';
    } else {
      cmpDebug.hidden = true;
      cmpDebug.textContent = '';
    }

    cmpMsg.hidden = true;
    cmpMsg.textContent = '';
    var frag = document.createDocumentFragment();
    var plotH = 120;
    rows.forEach(function (row) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hail-col';
      btn.setAttribute('aria-label', row.n + '，' + row.steps + ' 步');
      var val = document.createElement('span');
      val.className = 'hail-col-steps';
      val.textContent = String(row.steps);
      var plot = document.createElement('span');
      plot.className = 'hail-col-plot';
      var bar = document.createElement('span');
      bar.className = 'hail-col-bar';
      var h = maxSteps === 0 ? 6 : Math.max(6, Math.round(row.steps / maxSteps * plotH));
      bar.style.height = h + 'px';
      plot.appendChild(bar);
      var name = document.createElement('span');
      name.className = 'hail-col-name';
      name.textContent = String(row.n);
      btn.appendChild(val);
      btn.appendChild(plot);
      btn.appendChild(name);
      btn.addEventListener('click', function () {
        if (row.n === 27) {
          btn.classList.remove('is-no');
          btn.classList.add('is-yes');
          cmpMsg.hidden = false;
          cmpMsg.textContent = '30 以内，27 跳得最久，要 111 步。';
          Lab.goal('most');
          Lab.say('30 以内，27 跳得最久，要 111 步。');
          Lab.toast('');
        } else {
          btn.classList.remove('is-no');
          window.requestAnimationFrame(function () { btn.classList.add('is-no'); });
          window.setTimeout(function () { btn.classList.remove('is-no'); }, 320);
          Lab.bad();
          Lab.toast('再比比，哪根柱子最高？');
        }
      });
      frag.appendChild(btn);
    });
    cmp.replaceChildren(frag);
    compareBox.hidden = false;
  }

  document.getElementById('hailMinus').addEventListener('click', function () {
    Lab.click();
    if (startN <= 1) {
      Lab.toast('最小是 1。');
      return;
    }
    setStart(startN - 1);
  });
  document.getElementById('hailPlus').addEventListener('click', function () {
    Lab.click();
    if (startN >= 99) {
      Lab.toast('最大是 99。');
      return;
    }
    setStart(startN + 1);
  });
  input.addEventListener('input', function () {
    var clean = String(input.value).replace(/\D/g, '');
    if (clean !== input.value) input.value = clean;
    if (!clean) return;
    var n = parseInt(clean, 10);
    if (n >= 1 && n <= 99) setStart(n);
  });
  input.addEventListener('blur', function () {
    var n = clampFromInput();
    if (String(input.value).replace(/\D/g, '') === '') input.value = String(startN);
    else setStart(n);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('hailStart').click();
    }
  });
  document.getElementById('hailStart').addEventListener('click', function () {
    Lab.click();
    input.blur();
    startN = clampFromInput();
    input.value = String(startN);
    startAnim(false);
  });
  fastBtn.addEventListener('click', function () {
    Lab.click();
    input.blur();
    if (playing && resume) {
      fastMode = true;
      updateFastBtn();
      window.clearTimeout(timer);
      timer = window.setTimeout(resume, 12);
      return;
    }
    startN = clampFromInput();
    input.value = String(startN);
    startAnim(true);
  });
  document.getElementById('hailCompareBtn').addEventListener('click', showCompare);

  var downScroll = 0;
  cmpScroll.addEventListener('pointerdown', function (e) {
    dragMoved = false;
    dragX = e.clientX;
    downScroll = cmpScroll.scrollLeft;
  });
  cmpScroll.addEventListener('pointermove', function (e) {
    if (Math.abs(e.clientX - dragX) > 16) dragMoved = true;
  });
  cmpScroll.addEventListener('click', function (e) {
    var scrolled = Math.abs(cmpScroll.scrollLeft - downScroll) > 3;
    if (e.detail === 0 || (!dragMoved && !scrolled)) return;
    e.preventDefault();
    e.stopPropagation();
  }, true);

  resetAll = function () {
    stopAnim();
    startN = 27;
    input.value = '27';
    showIdle();
    clearCompare();
    Lab.toast('');
  };
})();
</script>
</body>
</html>
